name: Build and Push Docker Image on Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      base_image:
        description: Runtime image with ForestMamba dependencies and checkpoint
        required: false
        default: ghcr.io/3dtrees-earth/3dtrees_forestmamba_runtime:latest

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 3dtrees-earth/3dtrees_forestmamba
  BASE_IMAGE: ${{ inputs.base_image || 'ghcr.io/3dtrees-earth/3dtrees_forestmamba_runtime:latest' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.3dtrees
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

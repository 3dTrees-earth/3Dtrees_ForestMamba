name: Build and Push Docker Image on Release

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 3dtrees-earth/3dtrees_forestmamba
  BASE_IMAGE: forestmamba-image:3dtrees-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build ForestMamba base image
        run: docker build --file Dockerfile --tag "${BASE_IMAGE}" .

      - name: Build and push Docker image
        env:
          DOCKER_METADATA_OUTPUT_LABELS: ${{ steps.meta.outputs.labels }}
          DOCKER_METADATA_OUTPUT_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags <<< "${DOCKER_METADATA_OUTPUT_TAGS}"
          mapfile -t labels <<< "${DOCKER_METADATA_OUTPUT_LABELS}"

          tag_args=()
          for tag in "${tags[@]}"; do
            [ -n "${tag}" ] || continue
            tag_args+=(--tag "${tag}")
          done
          if [ "${#tag_args[@]}" -eq 0 ]; then
            echo "No Docker tags were generated by docker/metadata-action." >&2
            exit 1
          fi

          label_args=()
          for label in "${labels[@]}"; do
            [ -n "${label}" ] || continue
            label_args+=(--label "${label}")
          done

          docker build \
            --file Dockerfile.3dtrees \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            "${tag_args[@]}" \
            "${label_args[@]}" \
            .

          for tag in "${tags[@]}"; do
            [ -n "${tag}" ] || continue
            docker push "${tag}"
          done
